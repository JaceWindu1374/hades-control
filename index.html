<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hades Hair — Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-deep: #02042D;
    --blue-mid: #0A2050;
    --blue-bright: #46A0FF;
    --flare-red: #BE0000;
    --flare-orange: #CD1400;
    --flare-gold: #FF8C00;
    --flare-bright: #FFC300;
    --ink: #F4F6FA;
    --ink-dim: #9AA6C0;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.12);
    --transition-slow: 900ms ease;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    height: 100dvh; /* dynamic viewport height — accounts for Android's browser chrome/nav bar much more reliably than plain vh */
    overflow: hidden;
  }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 50% 20%, var(--blue-mid) 0%, var(--blue-deep) 65%);
    transition: background var(--transition-slow);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }

  body.flare-active {
    background: radial-gradient(circle at 50% 20%, var(--flare-orange) 0%, #1a0400 70%);
  }

  /* ---- Top bar: connection status ---- */
  .topbar {
    display: flex;
    justify-content: center;
    padding: 18px 16px 6px;
  }

  .conn-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #566;
    transition: background 300ms, box-shadow 300ms;
  }

  .conn-pill.connected .conn-dot {
    background: var(--blue-bright);
    box-shadow: 0 0 8px var(--blue-bright);
  }

  body.flare-active .conn-pill.connected .conn-dot {
    background: var(--flare-bright);
    box-shadow: 0 0 8px var(--flare-bright);
  }

  /* ---- Main HUD ---- */
  .hud {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    gap: 10px;
  }

  .scene-label {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .scene-name {
    font-size: clamp(38px, 11vw, 64px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(48px, 15vw, 88px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }

  .next-event {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--ink-dim);
    min-height: 20px;
  }

  .next-event .next-value {
    color: var(--ink);
    font-weight: 600;
  }

  /* ---- Bottom controls ---- */
  .controls {
    display: flex;
    gap: 12px;
    padding: 20px 20px calc(48px + env(safe-area-inset-bottom, 0px));
  }

  button {
    flex: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 20px 12px;
    border-radius: 14px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    transition: transform 100ms, background 200ms;
    -webkit-user-select: none;
    user-select: none;
  }

  button:active {
    transform: scale(0.96);
  }

  button.primary {
    background: var(--blue-bright);
    color: #041022;
    border-color: transparent;
  }

  body.flare-active button.primary {
    background: var(--flare-bright);
    color: #2a0a00;
  }

  button.danger {
    background: rgba(255,255,255,0.04);
    color: #ff8b8b;
    border-color: rgba(255,80,80,0.3);
  }

  button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .connect-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }

  .connect-screen h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .connect-screen p {
    color: var(--ink-dim);
    font-size: 14px;
    max-width: 280px;
    line-height: 1.5;
    margin: 0;
  }

  .error-msg {
    color: #ff8b8b;
    font-size: 13px;
    max-width: 280px;
    line-height: 1.4;
  }

  .toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(190,0,0,0.92);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    z-index: 20;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    transition: opacity 200ms;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div id="connectScreen" class="connect-screen">
    <h1>Hades Hair Control</h1>
    <p>Connect to the headpiece over Bluetooth to start and stop the fire sequence, synced with the audio.</p>
    <button class="primary" id="connectBtn" style="max-width:220px;">Connect</button>
    <div class="error-msg hidden" id="errorMsg"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="mainUI" class="hidden" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar">
      <div class="conn-pill" id="connPill">
        <span class="conn-dot"></span>
        <span id="connLabel">Connecting…</span>
      </div>
      <div class="conn-pill" id="audioPill" style="margin-left:8px; cursor:pointer;">
        <span class="conn-dot" id="audioDot"></span>
        <span id="audioLabel">No audio</span>
      </div>
    </div>

    <audio id="audioEl" preload="auto"></audio>
    <input type="file" id="audioFileInput" accept="audio/*" class="hidden">

    <div class="hud">
      <div class="scene-label" id="runStateLabel">IDLE</div>
      <div class="scene-name" id="sceneName">—</div>
      <div class="timer" id="timerDisplay">00:00</div>
      <div class="next-event" id="nextEvent"></div>
    </div>

    <div class="controls" id="controls">
      <!-- Buttons injected dynamically based on state -->
    </div>
  </div>

<script>
const SERVICE_UUID = 'a7d83bbc-fdf0-43d2-86ad-bd7685da610a';
const COMMAND_CHAR_UUID = '406af305-cabf-4819-bf42-5076c3902712';
const STATUS_CHAR_UUID = '9729b55a-ca1c-47b6-a3dd-21cf5854789a';

let device, server, commandChar, statusChar;
let lastRenderedState = null; // tracks the last state buttons were rendered for, so we don't rebuild them on every periodic status update — only on actual state changes

const FIRE_LABELS = {
  NONE: '—',
  BF1: 'Ambient Blue',
  RF1: 'Red Fire 1',
  RF2: 'Red Fire 2',
  RF3: 'Explosion',
  OFF: 'Cooldown'
};

const connectScreen = document.getElementById('connectScreen');
const mainUI = document.getElementById('mainUI');
const connectBtn = document.getElementById('connectBtn');
const errorMsg = document.getElementById('errorMsg');
const connPill = document.getElementById('connPill');
const connLabel = document.getElementById('connLabel');
const runStateLabel = document.getElementById('runStateLabel');
const sceneName = document.getElementById('sceneName');
const timerDisplay = document.getElementById('timerDisplay');
const nextEvent = document.getElementById('nextEvent');
const controls = document.getElementById('controls');
const toast = document.getElementById('toast');
const audioPill = document.getElementById('audioPill');
const audioDot = document.getElementById('audioDot');
const audioLabel = document.getElementById('audioLabel');
const audioEl = document.getElementById('audioEl');
const audioFileInput = document.getElementById('audioFileInput');

let writeInProgress = false;
let toastTimeout = null;
let audioLoaded = false;

const SCHEDULE_LEAD_MS = 3000; // must give the ESP32 enough lead time to receive + parse the command before the countdown ends
let scheduledAudioTimeout = null;
let countdownInterval = null;

// ---- Local audio caching (IndexedDB) ----
// Keeps the MP3 entirely on-device — never uploaded anywhere — so it only
// needs to be selected once, ever, and is remembered automatically after
// that on every future visit to this page.
const DB_NAME = 'hades-audio-db';
const STORE_NAME = 'files';
const AUDIO_KEY = 'mp3';

function openAudioDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveAudioBlob(blob) {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(blob, AUDIO_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadAudioBlob() {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(AUDIO_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function setAudioReady(isReady) {
  audioLoaded = isReady;
  audioLabel.textContent = isReady ? 'Audio loaded' : 'No audio — tap to load';
  audioPill.classList.toggle('connected', isReady);
}

// Silently warms up the browser's audio playback pipeline ahead of time
// (muted play, then immediate pause + rewind) — without this, the FIRST
// real .play() call in a session can take a noticeable moment to
// actually produce sound (buffering/decoding startup latency), which is
// very likely what was causing the audio to lag behind the LEDs. This
// must run in response to a genuine user gesture (a click), since
// browsers block autoplay otherwise — we call it both right after a
// file is selected and right when Connect is tapped, so it's covered
// whether this is the first time loading audio or a returning visit
// with audio already cached from before.
async function primeAudio() {
  if (!audioEl.src) return;
  try {
    audioEl.load();
    const wasMuted = audioEl.muted;
    audioEl.muted = true;
    await audioEl.play();
    audioEl.pause();
    audioEl.currentTime = 0;
    audioEl.muted = wasMuted;
  } catch (err) {
    console.error('Audio priming failed (will still try to play normally later):', err);
  }
}

async function initAudio() {
  try {
    const blob = await loadAudioBlob();
    if (blob) {
      audioEl.src = URL.createObjectURL(blob);
      setAudioReady(true);
    }
  } catch (err) {
    console.error('Failed to load cached audio:', err);
  }
}

audioPill.addEventListener('click', () => audioFileInput.click());

audioFileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    await saveAudioBlob(file);
    audioEl.src = URL.createObjectURL(file);
    setAudioReady(true);
    await primeAudio();
    showToast('Audio loaded and saved for next time');
  } catch (err) {
    console.error('Failed to save audio:', err);
    showToast('Failed to save audio');
  }
});

initAudio();

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.remove('hidden');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.add('hidden'), 2500);
}

function formatMs(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function formatSecondsShort(ms) {
  return (ms / 1000).toFixed(1) + 's';
}

function setFlareBackground(isFlare) {
  document.body.classList.toggle('flare-active', isFlare);
}

// Cancels any pending scheduled audio start and the local countdown timer
// — used whenever Stop is pressed, so a countdown-in-progress can't fire
// audio after the user has already cancelled.
function cancelScheduledAudio() {
  if (scheduledAudioTimeout) {
    clearTimeout(scheduledAudioTimeout);
    scheduledAudioTimeout = null;
  }
  if (countdownInterval) {
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
}

// Drives the "Starting in 3… 2… 1…" HUD display using the browser's own
// high-resolution clock (performance.now()), independent of the ESP32 —
// each side counts down the same known duration on its own local clock
// rather than reacting to a live signal at the actual start moment.
function beginCountdownUI(startAtPerf) {
  clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    const remaining = startAtPerf - performance.now();
    if (remaining <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      return;
    }
    runStateLabel.textContent = 'STARTING';
    sceneName.textContent = 'Get Ready';
    timerDisplay.textContent = (remaining / 1000).toFixed(1) + 's';
    nextEvent.textContent = '';
  }, 100);
}

async function handleStartTap(buttonEl) {
  if (!audioLoaded) {
    showToast('Load audio first (tap the audio pill)');
    return;
  }

  const ok = await sendCommand('SCHEDULE:' + SCHEDULE_LEAD_MS, buttonEl);
  if (!ok) return; // sendCommand already surfaced a failure toast

  // Both the ESP32 (via SCHEDULE:<ms>) and this page now independently
  // count down the SAME duration from THIS moment, each on its own local
  // clock — this is what keeps the LEDs and audio in sync without
  // depending on a live signal at the actual start instant.
  const startAtPerf = performance.now() + SCHEDULE_LEAD_MS;
  beginCountdownUI(startAtPerf);

  scheduledAudioTimeout = setTimeout(() => {
    audioEl.currentTime = 0;
    audioEl.play().catch((err) => console.error('Audio play failed:', err));
  }, SCHEDULE_LEAD_MS);
}

async function handleStopTap(buttonEl) {
  cancelScheduledAudio();
  audioEl.pause();
  audioEl.currentTime = 0;
  await sendCommand('STOP', buttonEl);
}

function renderButtons(runState) {
  controls.innerHTML = '';
  const make = (label, cls, onClick) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = () => onClick(b);
    return b;
  };

  if (runState === 'IDLE') {
    controls.appendChild(make('Start', 'primary', handleStartTap));
  } else if (runState === 'RUNNING' || runState === 'SCHEDULED') {
    controls.appendChild(make('Stop', 'danger', handleStopTap));
  }
}

function handleStatus(value) {
  // Format: STATE|elapsedMs|fireName|msUntilNext
  const parts = value.split('|');
  if (parts.length < 4) return;

  const [state, elapsedStr, fire, nextStr] = parts;
  const elapsed = parseInt(elapsedStr, 10) || 0;
  const msUntilNext = parseInt(nextStr, 10);

  // While our own local countdown is actively driving the "Starting
  // in…" display, don't let a firmware status overwrite it — the local
  // clock is the authority for that brief window since it's what audio
  // playback is timed against.
  const localCountdownActive = (countdownInterval !== null);

  if (!localCountdownActive) {
    runStateLabel.textContent = state;
    sceneName.textContent = FIRE_LABELS[fire] || fire;
    timerDisplay.textContent = formatMs(elapsed);

    const isFlare = (fire === 'RF1' || fire === 'RF2' || fire === 'RF3');
    setFlareBackground(isFlare);

    if (state === 'RUNNING' && msUntilNext >= 0) {
      const nextWindowFire = guessNextFire(fire, elapsed);
      nextEvent.innerHTML = 'Next: <span class="next-value">' + nextWindowFire + ' in ' + formatSecondsShort(msUntilNext) + '</span>';
    } else {
      nextEvent.textContent = '';
    }
  }

  if (state !== lastRenderedState) {
    lastRenderedState = state;
    renderButtons(state);
  }
}

// Best-effort label for the upcoming event — the firmware only sends the
// countdown, not which fire is next, so this infers it from the known
// timeline order. Falls back to "Fire" if it can't tell.
function guessNextFire(currentFire, elapsedMs) {
  // Known window starts (ms) — keep in sync with the firmware's rfWindows[]
  const windows = [
    { start: 16000, fire: 'Red Fire 1' },
    { start: 23500, fire: 'Red Fire 2' },
    { start: 36750, fire: 'Explosion' }
  ];
  for (const w of windows) {
    if (w.start > elapsedMs) return w.fire;
  }
  return 'Fire';
}

async function sendCommand(cmd, buttonEl) {
  if (!commandChar) return false;

  // Prevent overlapping GATT operations — sending a second command while
  // one is still in flight is a common cause of silent drops on BLE.
  if (writeInProgress) return false;
  writeInProgress = true;
  if (buttonEl) buttonEl.disabled = true;

  const encoder = new TextEncoder();
  const data = encoder.encode(cmd);

  const MAX_ATTEMPTS = 3;
  let succeeded = false;

  for (let attempt = 1; attempt <= MAX_ATTEMPTS && !succeeded; attempt++) {
    try {
      // Explicitly request "write with response" (an acknowledged write)
      // rather than the legacy writeValue(), which can silently behave as
      // an unacknowledged "write without response" on some browsers/BLE
      // stacks — this is likely why commands were occasionally getting
      // dropped without any visible error.
      if (commandChar.writeValueWithResponse) {
        await commandChar.writeValueWithResponse(data);
      } else {
        await commandChar.writeValue(data);
      }
      succeeded = true;
    } catch (err) {
      console.error('Write attempt ' + attempt + ' for "' + cmd + '" failed:', err);
      if (attempt < MAX_ATTEMPTS) {
        await new Promise((r) => setTimeout(r, 150)); // brief pause before retrying
      }
    }
  }

  if (!succeeded) {
    showToast('"' + cmd + '" failed to send — try again');
  }

  if (buttonEl) buttonEl.disabled = false;
  writeInProgress = false;
  return succeeded;
}

async function connectBLE() {
  errorMsg.classList.add('hidden');

  if (!navigator.bluetooth) {
    errorMsg.textContent = 'Web Bluetooth is not available. Make sure you\'re using Chrome on Android over HTTPS.';
    errorMsg.classList.remove('hidden');
    return;
  }

  // Runs on the same tap as Connect — a genuine user gesture — so any
  // audio already cached from a previous visit gets warmed up now,
  // well before Start is ever pressed.
  primeAudio();

  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);

    connectScreen.classList.add('hidden');
    mainUI.classList.remove('hidden');
    mainUI.style.display = 'flex';

    server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    commandChar = await service.getCharacteristic(COMMAND_CHAR_UUID);
    statusChar = await service.getCharacteristic(STATUS_CHAR_UUID);

    await statusChar.startNotifications();
    statusChar.addEventListener('characteristicvaluechanged', (event) => {
      const decoder = new TextDecoder();
      const value = decoder.decode(event.target.value);
      handleStatus(value);
    });

    connPill.classList.add('connected');
    connLabel.textContent = 'Connected';

  } catch (err) {
    console.error(err);
    connectScreen.classList.remove('hidden');
    mainUI.classList.add('hidden');
    errorMsg.textContent = 'Connection failed: ' + err.message;
    errorMsg.classList.remove('hidden');
  }
}

function onDisconnected() {
  cancelScheduledAudio();
  audioEl.pause();
  connPill.classList.remove('connected');
  connLabel.textContent = 'Disconnected';
  controls.innerHTML = '';
  runStateLabel.textContent = 'DISCONNECTED';
  sceneName.textContent = '—';
  timerDisplay.textContent = '00:00';
  nextEvent.textContent = '';
  setFlareBackground(false);
  lastRenderedState = null;
}

connectBtn.addEventListener('click', connectBLE);
</script>
</body>
</html>
